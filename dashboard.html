<!DOCTYPE html>
<html lang="en">
<head>
    <title>CloudVault Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard" id="dropArea">

    <h1>CloudVault Pro</h1>
<p id="welcomeText">Welcome Back 👋</p>

    <!-- Storage Bar -->
    <h3>Storage Used</h3>
    <div class="storage-box">
       <div class="storage-fill" id="storageBar"></div>
    </div>
    <p id="storageText">20GB / 100GB Used</p>
<p id="fileCount">Total Files: 3</p>
    <!-- Upload -->
<input type="file" id="fileUpload" hidden>

<button onclick="document.getElementById('fileUpload').click()">
  Upload File
</button>
    <input type="text" id="searchBox" placeholder="Search file...">
    <h3>Your Files</h3>

<ul id="fileList">
  <li>📄 Resume.pdf <button onclick="this.parentElement.remove()">❌</button></li>
  <li>📷 Photo.png <button onclick="this.parentElement.remove()">❌</button></li>
  <li>🎵 Song.mp3 <button onclick="this.parentElement.remove()">❌</button></li>
</ul>
    <!-- Logout -->
    <button onclick="window.location.href='index.html'">Logout</button>

</div>
<script>
    let userEmail = localStorage.getItem("userEmail");

if (userEmail) {
   document.getElementById("welcomeText").innerHTML =
      "Welcome " + userEmail.split("@")[0] + " 👋";
}
const upload = document.getElementById("fileUpload");
    const dropArea = document.getElementById("dropArea");
const list = document.getElementById("fileList");
const searchBox = document.getElementById("searchBox");
let storage = 20;
const storageText = document.getElementById("storageText");
const storageBar = document.getElementById("storageBar");
    const fileCount = document.getElementById("fileCount");
let totalFiles = 3;
    const maxFiles = 10;
upload.addEventListener("change", function () {
    if (upload.files.length > 0) {
        let li = document.createElement("li");
        let fileName = upload.files[0].name;
let icon = "📁";

if (fileName.endsWith(".pdf")) {
   icon = "📄";
}
else if (fileName.endsWith(".png") || fileName.endsWith(".jpg") || fileName.endsWith(".jpeg")) {
   icon = "🖼️";
}
else if (fileName.endsWith(".mp3")) {
   icon = "🎵";
}
else if (fileName.endsWith(".mp4")) {
   icon = "🎬";
}
        else if (fileName.endsWith(".doc") || fileName.endsWith(".docx")) {
   icon = "📄";
}
else if (fileName.endsWith(".zip")) {
   icon = "🗜️";
}
else if (fileName.endsWith(".txt")) {
   icon = "📝";
}
li.innerHTML = icon + " " + fileName + 
' <button onclick="removeFile(this)">❌</button>';
        list.appendChild(li);
       let fileSize = upload.files[0].size / (1024 * 1024 * 1024); 
storage = storage + fileSize;

totalFiles++;
fileCount.innerHTML = "Total Files: " + totalFiles;
storageText.innerHTML = storage + "GB / 100GB Used";
storageBar.style.width = storage + "%";
    }
});
    
    function removeFile(btn){
   btn.parentElement.remove();

   storage--;
totalFiles--;
fileCount.innerHTML = "Total Files: " + totalFiles;
   storageText.innerHTML = storage.toFixed(2) + "GB / 100GB Used";

   storageBar.style.width = storage + "%";
}
    searchBox.addEventListener("keyup", function () {
   let filter = searchBox.value.toLowerCase();
   let items = list.getElementsByTagName("li");

   for (let i = 0; i < items.length; i++) {
      let text = items[i].textContent.toLowerCase();

      if (text.includes(filter)) {
         items[i].style.display = "";
      } else {
         items[i].style.display = "none";
      }
   }
});
   
dropArea.addEventListener("dragover", function(e) {
  e.preventDefault();
});

dropArea.addEventListener("drop", function(e) {
  e.preventDefault();

  let file = e.dataTransfer.files[0];

  if (file) {
    let li = document.createElement("li");
    li.innerHTML = "📂 " + file.name +
      ' <button onclick="removeFile(this)">❌</button>';

    list.appendChild(li);

    let fileSize = file.size / (1024 * 1024 * 1024);
    storage = storage + fileSize;

    storageText.innerHTML = storage.toFixed(2) + "GB / 100GB Used";
    storageBar.style.width = storage + "%";
  }
});
    dropArea.addEventListener("dragover", function(e){
    e.preventDefault();
    dropArea.style.border = "2px dashed yellow";
});

dropArea.addEventListener("dragleave", function(){
    dropArea.style.border = "none";
});

dropArea.addEventListener("drop", function(e){
    e.preventDefault();
    dropArea.style.border = "none";

    upload.files = e.dataTransfer.files;

    upload.dispatchEvent(new Event("change"));
});
    </script>
</body>
</html>
