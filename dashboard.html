<!DOCTYPE html>
<html lang="en">
<head>
    <title>CloudVault Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard">

    <h1>CloudVault Pro</h1>
    <p>Welcome Back 👋</p>

    <!-- Storage Bar -->
    <h3>Storage Used</h3>
    <div class="storage-box">
       <div class="storage-fill" id="storageBar"></div>
    </div>
    <p id="storageText">20GB / 100GB Used</p>

    <!-- Upload -->
<input type="file" id="fileUpload" hidden>

<button onclick="document.getElementById('fileUpload').click()">
  Upload File
</button>
    <h3>Your Files</h3>

<ul id="fileList">
  <li>📄 Resume.pdf <button onclick="this.parentElement.remove()">❌</button></li>
  <li>📷 Photo.png <button onclick="this.parentElement.remove()">❌</button></li>
  <li>🎵 Song.mp3 <button onclick="this.parentElement.remove()">❌</button></li>
</ul>
    <!-- Logout -->
    <button onclick="window.location.href='index.html'">Logout</button>

</div>
<script>
const upload = document.getElementById("fileUpload");
const list = document.getElementById("fileList");
let storage = 20;
const storageText = document.getElementById("storageText");
const storageBar = document.getElementById("storageBar");
upload.addEventListener("change", function () {
    if (upload.files.length > 0) {
        let li = document.createElement("li");
        li.innerHTML = "📁 " + upload.files[0].name + ' <button onclick="this.parentElement.remove()">❌</button>';
        list.appendChild(li);
        storage++;
storageText.innerHTML = storage + "GB / 100GB Used";
storageBar.style.width = storage + "%";
    }
});
</script>
</body>
</html>
